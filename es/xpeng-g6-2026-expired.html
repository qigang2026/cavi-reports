    html, body {

      animation: expiredFade 0.3s ease;
    }
    @keyframes expiredFade { from { opacity: 0; } to { opacity: 1; } }

    /* ============ 过期卡片 ============ */
    .expired-card {
      position: relative;
      width: 100%;
      max-width: 420px;          /* H5 紧凑 */
      background: #fff;
      border-radius: 16px;
      padding: 28px 22px 22px;
      color: #0a1929;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      animation: expiredScale 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
    }
    @keyframes expiredScale {
      from { transform: scale(0.92); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .expired-icon {
      width: 56px; height: 56px;
      margin: 0 auto 14px;
      background: rgba(255, 107, 107, 0.12);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #ff6b6b;
    }
    .expired-title { font-size: 19px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
    .expired-reasons {
      display: flex; flex-direction: column; gap: 6px;
      background: #f7f8fa;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 14px;
      text-align: left;
    }
    .reason { display: flex; align-items: center; gap: 10px; font-size: 12px; color: rgba(10, 25, 41, 0.78); }

    /* reason 编号色块 (替代 emoji) */

      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px;
      font-family: "Chakra Petch", "Inter", sans-serif;
      font-size: 10px; font-weight: 700;
      line-height: 1;
      color: #d63d3d;
      background: rgba(214, 61, 61, 0.12);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .expired-desc { font-size: 12px; color: rgba(10, 25, 41, 0.62); line-height: 1.6; margin: 0 0 18px; }
    .expired-actions { display: flex; flex-direction: column; gap: 6px; }
    .btn-wa {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 20px;
      background: #25D366; color: #fff;
      border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-wa:hover { background: #1ebe57; }
    .btn-wa:active { background: #1ebe57; transform: scale(0.98); }
    .expired-foot {
      margin: 16px 0 0;
      font-size: 10px;
      color: rgba(10, 25, 41, 0.4);
      border-top: 1px solid rgba(10, 25, 41, 0.08);
      padding-top: 12px;
    }

      .btn-wa { padding: 16px 24px; font-size: 15px; }
